<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ademvnion</title>
<meta name="description" content="Ademvnion — coming soon.">
<style>
  :root{--bg:#0b0d12;--fg:#f3f4f6;--muted:#9aa3b2;--line:#1f2430}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:grid;place-items:center;padding:16px}
  main{text-align:center;max-width:560px}
  .mark{width:56px;height:56px;border:2px solid var(--fg);border-radius:14px;display:grid;place-items:center;margin:0 auto 28px;font-weight:700;font-size:26px;letter-spacing:-.02em}
  h1{font-size:clamp(28px,6vw,44px);letter-spacing:.18em;text-transform:uppercase;font-weight:600}
  p{color:var(--muted);margin-top:14px}
  hr{border:0;border-top:1px solid var(--line);margin:36px auto;width:64px}
  a{color:var(--muted);text-decoration:none;font-size:14px}
  a:hover{color:var(--fg)}
</style>
</head>
<body>
<main>
  <div class="mark">A</div>
  <h1>Ademvnion</h1>
  <p>Something new is on its way.</p>
  <hr>
  <a href="mailto:hello@ademvnion.com">hello@ademvnion.com</a>
</main>
</body>
</html>
